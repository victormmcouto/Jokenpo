<!DOCTYPE hmtl>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <title>Jokenpô</title>
    <link rel="stylesheet"
          href="./styles/DOM-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Jokenpô</p>
    <p>
      <button onclick="match('Rock', computerChoice());"
              class="move-button">
        <img src="./assets/rock-emoji.png"
             class="move-icon">
      </button>
      <button onclick="match('Paper', computerChoice())"
              class="move-button">
        <img src="./assets/paper-emoji.png"
             class="move-icon">
      </button>
      <button onclick="match('Scissors', computerChoice())"
              class="move-button">
        <img src="./assets/scissors-emoji.png"
             class="move-icon">
      </button>
    </p>
    <p class="js-result result"></p>
    <p class="js-match"></p>
    <p class="js-score score"></p>
    <p>
      <button onclick="resetScore()"
              class="reset-score-button">
      Reset Score
      </button>
    </p>
    <script src="./scripts/DOM-rock-paper-scissors.js"></script>
  </body>
</html>
